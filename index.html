<!doctype html>
<html lang="en" data-theme="light" data-accent="teal">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta
      name="description"
      content="An open source dashboard starter. Thoughtful layouts, useful elements, and room to make it yours."
    />
    <script>
      try {
        const preferences = JSON.parse(localStorage.getItem('workspace.preferences.v1') || '{}');
        const theme = ['light', 'dark', 'system'].includes(preferences.theme)
          ? preferences.theme
          : 'light';
        document.documentElement.dataset.theme =
          theme === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : theme;
        document.documentElement.dataset.accent = ['teal', 'blue', 'violet', 'rose'].includes(
          preferences.accent,
        )
          ? preferences.accent
          : 'teal';
      } catch {}
    </script>
    <title>Workspace — Dashboard starter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
